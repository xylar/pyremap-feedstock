schema_version: 1

context:
  name: pyremap
  version: "2.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/MPAS-Dev/${{ name }}/archive/${{ version }}.tar.gz
  sha256: 199804403a3171ed3a0011e1018d30ce47671e4e64c6a3156cabb334af1d15f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - netcdf4
    - xarray >=0.10.0
    - dask
    - nco >=4.8.1
    - esmf
    - pyproj

tests:
  - python:
      imports:
        - pyremap
      pip_check: false
      python_version: ${{ python_min }}
  - files:
      source:
        - tests
    requirements:
      run:
        - pytest
        - python ${{ python_min }}.*
    script:
      - pytest --pyargs tests

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python remapping tools for climate and earth system models.
  homepage: https://github.com/MPAS-Dev/pyremap
  repository: https://github.com/MPAS-Dev/pyremap
  documentation: https://pyremap.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - xylar
